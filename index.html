<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonsterQuest</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #181820;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: "Courier New", monospace;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: min(96vw, 960px);
    max-height: 92vh;
    aspect-ratio: 480 / 384;
    background: #000;
    border: 4px solid #3a3a4a;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  #help {
    color: #8a8aa0;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    line-height: 1.5;
  }
  #help b { color: #d0d0e0; }
</style>
</head>
<body>
  <canvas id="screen" width="480" height="384"></canvas>
  <div id="help">
    <b>Arrows / WASD</b> move &nbsp;•&nbsp; <b>Z / Enter</b> confirm (A) &nbsp;•&nbsp;
    <b>X / Backspace</b> cancel (B) &nbsp;•&nbsp; <b>Esc</b> menu
  </div>
  <script src="js/data.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
