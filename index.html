<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MonsterQuest</title>
<meta name="theme-color" content="#181820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonsterQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="screen" width="960" height="540"></canvas>
  <div id="rotate" aria-hidden="true"><div>Rotate your device to landscape<br><small>MonsterQuest plays best sideways</small></div></div>
  <!-- SCRIPTS -->
  <!-- /SCRIPTS -->
  <script>
    (function () {
      // Best-effort fullscreen + landscape lock on first gesture (mobile only)
      var coarse = false;
      try { coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
      function first() {
        window.removeEventListener("pointerdown", first, true);
        window.removeEventListener("touchend", first, true);
        if (!coarse) return;
        var el = document.documentElement;
        var rf = el.requestFullscreen || el.webkitRequestFullscreen;
        try { if (rf && !document.fullscreenElement) { var p = rf.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); } } catch (e) {}
        try { if (screen.orientation && screen.orientation.lock) { var q = screen.orientation.lock("landscape"); if (q && q.catch) q.catch(function () {}); } } catch (e) {}
      }
      window.addEventListener("pointerdown", first, true);
      window.addEventListener("touchend", first, true);
      // Service worker for offline / installed play (needs http(s))
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
      if (window.MQ && MQ.Boot && !window.__MQ_NO_BOOT) MQ.Boot.start();
    })();
  </script>
</body>
</html>
