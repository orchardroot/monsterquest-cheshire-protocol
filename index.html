  <script>
    (function () {
      // Best-effort fullscreen + landscape lock on first gesture (mobile only)
      var coarse = false;
      try { coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
      function first() {
        window.removeEventListener("pointerdown", first, true);
        window.removeEventListener("touchend", first, true);
        if (!coarse) return;
        var el = document.documentElement;
        var rf = el.requestFullscreen || el.webkitRequestFullscreen;
        try { if (rf && !document.fullscreenElement) { var p = rf.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(function () {}); } } catch (e) {}
        try { if (screen.orientation && screen.orientation.lock) { var q = screen.orientation.lock("landscape"); if (q && q.catch) q.catch(function () {}); } } catch (e) {}
      }
      window.addEventListener("pointerdown", first, true);
      window.addEventListener("touchend", first, true);
      // Service worker for offline / installed play (needs http(s))
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
      if (window.MQ && MQ.Boot && !window.__MQ_NO_BOOT) MQ.Boot.start();
    })();
  </script>
