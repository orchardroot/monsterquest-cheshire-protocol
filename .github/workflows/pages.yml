name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "claude/pokemon-style-game-q728v6"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages can only be switched on by a repo admin (Settings -> Pages ->
      # Source: GitHub Actions). Until then, skip quietly instead of failing.
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository. Enable it once under Settings -> Pages -> Source: GitHub Actions, and this workflow will deploy on the next run."
          fi

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: .

      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
